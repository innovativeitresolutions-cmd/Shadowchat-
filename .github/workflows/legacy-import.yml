name: Legacy archive import

on:
  push:
    branches:
      - import/full-legacy-355k

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone historical public SKYCOIN source
        run: |
          rm -rf /tmp/skycoin-legacy
          git clone --depth 1 https://github.com/IITR-skycoin4444/skycoin4444.git /tmp/skycoin-legacy

      - name: Stage legacy source under quarantine
        run: |
          rm -rf legacy-archive/skycoin-production-2026-09
          mkdir -p legacy-archive/skycoin-production-2026-09
          rsync -a             --exclude='.git/'             --exclude='node_modules/'             --exclude='dist/'             --exclude='.cache/'             /tmp/skycoin-legacy/ legacy-archive/skycoin-production-2026-09/

      - name: Compare against recovered archive inventory
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path

          inventory = Path("legacy-archive/FILE_INVENTORY.csv")
          prefix = "legacy/skycoin-production-2026-09/"
          root = Path("legacy-archive/skycoin-production-2026-09")

          rows = []
          with inventory.open(newline="", encoding="utf-8") as fh:
              for row in csv.DictReader(fh):
                  path = row["path"]
                  if path.startswith(prefix):
                      rows.append(row)

          exact, changed, missing = [], [], []
          expected_loc = 0
          for row in rows:
              rel = row["path"][len(prefix):]
              target = root / rel
              try:
                  expected_loc += int(row.get("source_loc") or 0)
              except ValueError:
                  pass
              if not target.is_file():
                  missing.append(rel)
                  continue
              actual = hashlib.sha256(target.read_bytes()).hexdigest()
              if actual == row["sha256"]:
                  exact.append(rel)
              else:
                  changed.append({
                      "path": rel,
                      "expected_sha256": row["sha256"],
                      "actual_sha256": actual,
                  })

          expected_paths = {row["path"][len(prefix):] for row in rows}
          imported_paths = {
              p.relative_to(root).as_posix()
              for p in root.rglob("*")
              if p.is_file()
          }
          extra = sorted(imported_paths - expected_paths)

          source_exts = {".ts", ".tsx", ".sql", ".css", ".mjs", ".js", ".sh", ".html"}
          imported_loc = 0
          imported_source_files = 0
          for p in root.rglob("*"):
              if p.is_file() and p.suffix.lower() in source_exts:
                  # The recovered manifest intentionally counts source files and
                  # excludes generated/dependency output. pnpm lock data is YAML
                  # and therefore outside this extension set.
                  try:
                      imported_loc += sum(1 for _ in p.open("r", encoding="utf-8", errors="ignore"))
                      imported_source_files += 1
                  except OSError:
                      pass

          report = {
              "reference_inventory_paths": len(rows),
              "exact_hash_matches": len(exact),
              "hash_mismatches": len(changed),
              "missing_from_public_source": len(missing),
              "extra_in_public_source": len(extra),
              "reference_source_loc": expected_loc,
              "imported_source_files_by_extension": imported_source_files,
              "imported_source_loc_by_extension": imported_loc,
              "source_repository": "https://github.com/IITR-skycoin4444/skycoin4444",
              "source_branch": "main",
              "note": "The imported public tree is quarantined legacy material and is not part of the active runtime.",
          }
          Path("legacy-archive/IMPORT_COMPARISON.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )

          md = [
              "# Legacy Import Comparison",
              "",
              "This report compares the GitHub-transferred historical tree with the recovered archive inventory.",
              "",
              f"- Reference inventory paths: **{len(rows):,}**",
              f"- Exact SHA-256 matches: **{len(exact):,}**",
              f"- Hash mismatches: **{len(changed):,}**",
              f"- Missing from public source: **{len(missing):,}**",
              f"- Extra in public source: **{len(extra):,}**",
              f"- Reference selected source LOC: **{expected_loc:,}**",
              f"- Imported source LOC over the same source-extension family: **{imported_loc:,}**",
              "",
              "## Hash mismatches",
              "",
          ]
          md += [f"- `{x['path']}`" for x in changed] or ["- None"]
          md += ["", "## Missing paths", ""]
          md += [f"- `{x}`" for x in missing] or ["- None"]
          md += ["", "## Extra paths (first 500)", ""]
          md += [f"- `{x}`" for x in extra[:500]] or ["- None"]
          Path("legacy-archive/IMPORT_COMPARISON.md").write_text(
              "\n".join(md) + "\n", encoding="utf-8"
          )

          print(json.dumps(report, indent=2))
          PY

      - name: Commit imported legacy tree and comparison evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy-archive
          if git diff --cached --quiet; then
            echo "No legacy import changes to commit."
            exit 0
          fi
          git commit -m "import(legacy): stage historical SKYCOIN source archive [skip ci]"
          git push origin HEAD:import/full-legacy-355k
