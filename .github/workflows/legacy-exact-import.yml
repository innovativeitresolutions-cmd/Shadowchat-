name: Exact recovered legacy archive import

on:
  push:
    branches:
      - import/full-legacy-355k

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'ci(legacy): reconstruct exact recovered archive'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct recovered ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat legacy-archive/.transfer/chunk-*.b64 | base64 --decode > /tmp/SKYCOIN4444_LEGACY_CONSOLIDATION.zip
          echo "beca31f9ff509662e0550df2b0e650a9a21fbe63b601201a2c6fd3e9233cf5b8  /tmp/SKYCOIN4444_LEGACY_CONSOLIDATION.zip" | sha256sum -c -
          mkdir -p /tmp/legacy-exact
          unzip -q /tmp/SKYCOIN4444_LEGACY_CONSOLIDATION.zip -d /tmp/legacy-exact
          test -d /tmp/legacy-exact/SKYCOIN4444_LEGACY_CONSOLIDATION/legacy/skycoin-production-2026-09

      - name: Replace approximation with exact recovered archive
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/legacy-exact/SKYCOIN4444_LEGACY_CONSOLIDATION
          rm -rf legacy-archive/skycoin-production-2026-09
          rm -rf legacy-archive/optimized-deploy-scripts
          cp -a "$SRC/legacy/skycoin-production-2026-09" legacy-archive/
          cp -a "$SRC/legacy/optimized-deploy-scripts" legacy-archive/
          cp "$SRC/FILE_INVENTORY.csv" legacy-archive/FILE_INVENTORY.csv
          cp "$SRC/CONSOLIDATION_MANIFEST.md" legacy-archive/CONSOLIDATION_MANIFEST.md
          rm -f legacy-archive/IMPORT_COMPARISON.json legacy-archive/IMPORT_COMPARISON.md

      - name: Verify every recovered file and LOC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path

          base = Path("legacy-archive")
          inventory = base / "FILE_INVENTORY.csv"
          rows = list(csv.DictReader(inventory.open(newline="", encoding="utf-8")))

          exact = 0
          missing = []
          mismatched = []
          source_files = 0
          source_loc_inventory = 0
          source_loc_recounted = 0
          loc_mismatches = []

          for row in rows:
              rel = row["path"]
              if not rel.startswith("legacy/"):
                  raise SystemExit(f"Unexpected inventory path outside legacy/: {rel}")
              target = base / rel[len("legacy/"):]
              if not target.is_file():
                  missing.append(rel)
                  continue
              actual_hash = hashlib.sha256(target.read_bytes()).hexdigest()
              if actual_hash != row["sha256"]:
                  mismatched.append(rel)
                  continue
              exact += 1

              if row.get("source_loc"):
                  expected_lines = int(row["source_loc"])
                  source_files += 1
                  source_loc_inventory += expected_lines
                  with target.open("r", encoding="utf-8", errors="ignore") as fh:
                      actual_lines = sum(1 for _ in fh)
                  source_loc_recounted += actual_lines
                  if actual_lines != expected_lines:
                      loc_mismatches.append({
                          "path": rel,
                          "expected": expected_lines,
                          "actual": actual_lines,
                      })

          expected_total_rows = 1758
          expected_source_files = 1693
          expected_source_loc = 355835

          if len(rows) != expected_total_rows:
              raise SystemExit(f"Inventory row count mismatch: {len(rows)} != {expected_total_rows}")
          if missing:
              raise SystemExit(f"Missing recovered files: {len(missing)}")
          if mismatched:
              raise SystemExit(f"SHA-256 mismatches: {len(mismatched)}")
          if loc_mismatches:
              raise SystemExit(f"Source LOC per-file mismatches: {len(loc_mismatches)}")
          if source_files != expected_source_files:
              raise SystemExit(f"Source file count mismatch: {source_files} != {expected_source_files}")
          if source_loc_inventory != expected_source_loc:
              raise SystemExit(f"Inventory source LOC mismatch: {source_loc_inventory} != {expected_source_loc}")
          if source_loc_recounted != expected_source_loc:
              raise SystemExit(f"Recounted source LOC mismatch: {source_loc_recounted} != {expected_source_loc}")

          evidence = {
              "archive_sha256": "beca31f9ff509662e0550df2b0e650a9a21fbe63b601201a2c6fd3e9233cf5b8",
              "inventory_rows": len(rows),
              "exact_sha256_matches": exact,
              "missing_files": 0,
              "hash_mismatches": 0,
              "selected_source_files": source_files,
              "selected_source_loc": source_loc_recounted,
              "quarantined": True,
              "active_runtime_imported": False,
              "production_readiness_claim": False,
          }
          (base / "IMPORT_VERIFICATION.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          (base / "IMPORT_VERIFICATION.md").write_text(
              "# Exact Legacy Archive Import Verification\n\n"
              "The recovered legacy archive was reconstructed from temporary transfer chunks and verified before commit.\n\n"
              f"- Archive SHA-256: `{evidence['archive_sha256']}`\n"
              f"- Inventory rows verified: **{evidence['inventory_rows']:,} / {evidence['inventory_rows']:,}**\n"
              f"- Exact file SHA-256 matches: **{evidence['exact_sha256_matches']:,}**\n"
              f"- Missing files: **0**\n"
              f"- Hash mismatches: **0**\n"
              f"- Selected source files: **{evidence['selected_source_files']:,}**\n"
              f"- Selected source LOC recounted: **{evidence['selected_source_loc']:,}**\n\n"
              "The archive is stored under `legacy-archive/` as quarantined historical source. "
              "It is not loaded by the active runtime and does not establish production readiness or validate historical external-service claims.\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, indent=2))
          PY

      - name: Remove temporary transfer material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf legacy-archive/.transfer
          rm -f .github/workflows/legacy-exact-import.yml

      - name: Commit exact recovered archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A legacy-archive .github/workflows/legacy-exact-import.yml
          git commit -m "import(legacy): add exact 355835-LOC recovered archive [skip ci]"
          git push origin HEAD:import/full-legacy-355k
