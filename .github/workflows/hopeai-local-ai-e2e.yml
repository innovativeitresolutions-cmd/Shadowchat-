name: HopeAI real browser AI generation check

on:
  push:
    branches: ['deploy/hopeai-standalone-beta-*']
    paths:
      - 'hopeai-preview/**'
      - '.github/workflows/hopeai-local-ai-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hopeai-local-inference-e2e
  cancel-in-progress: true

jobs:
  real-local-model:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        working-directory: hopeai-preview
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Download ONNX model and require genuine inference output
        shell: bash
        env:
          PORT: '10000'
          NODE_ENV: production
          HOPEAI_PUBLIC_ORIGIN: http://127.0.0.1:10000
        run: |
          set -euo pipefail
          node hopeai-preview/server.mjs > /tmp/hopeai-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl --silent --fail http://127.0.0.1:10000/healthz >/dev/null && break
            sleep 1
          done
          curl --fail http://127.0.0.1:10000/healthz
          node hopeai-preview/local-ai-browser-smoke.mjs
