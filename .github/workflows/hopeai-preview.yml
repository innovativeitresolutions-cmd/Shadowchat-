name: Standalone HopeAI beta checks

on:
  push:
    branches: ['deploy/hopeai-standalone-beta-*']
  pull_request:
    paths:
      - 'hopeai-preview/**'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check server, client and test syntax
        run: |
          node --check hopeai-preview/server.mjs
          node --check hopeai-preview/app.js
          node --check hopeai-preview/server.test.mjs
          node --check hopeai-preview/local-ai-core.mjs
          node --check hopeai-preview/local-ai-worker.mjs
          node --check hopeai-preview/local-ai-ui.mjs
          node --check hopeai-preview/local-ai.test.mjs
          node --check hopeai-preview/trust.mjs
          node --check hopeai-preview/trust.test.mjs
      - name: Run isolated beta tests
        run: npm --prefix hopeai-preview test
